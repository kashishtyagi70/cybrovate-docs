<!-- Shared top navigation used by both the home page and docs pages. -->
<header class="topbar">
    <!-- Mobile-only button that opens the sidebar as an overlay. -->
    <button class="mobile-sidebar-button" type="button" data-mobile-sidebar-toggle aria-label="Open documentation navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <a class="topbar-brand" href="/" aria-label="Cybrovate Documentation home">
        <!-- Only your provided logo is shown here. Replace Images/favicon.ico to change it. -->
        <img class="topbar-logo" src="{{ url_for('images', path='/favicon.ico') }}" alt="Cybrovate Documentation" width="36" height="36">
        <span class="topbar-brand-name">Cybrovate Documentation</span>
    </a>

    <!-- External company website link. -->
    <a class="topbar-link" href="https://www.cybrovate.com/" target="_blank" rel="noreferrer">Cybrovate</a>

    <!-- Theme switcher: static/app.js changes the page between dark and light. -->
    <button class="topbar-toggle" type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="false" title="Switch theme">
        <span class="theme-icon" aria-hidden="true"></span>
    </button>
</header>
