{% extends "base.html" %}

{% block content %}
<div class="login-shell">
    {% include "_topbar.html" %}

    <main class="login-main">
        <section class="login-card login-card-narrow" aria-labelledby="reset-title">
            <div class="login-brand-mark">
                <img src="{{ url_for('images', path='/favicon.ico') }}" alt="" width="44" height="44">
            </div>

            <p class="dashboard-kicker">Password Reset</p>
            <h1 id="reset-title">Reset password</h1>
            <p class="login-copy">Enter your username, account email, and a new password.</p>

            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="login-success">{{ success }}</div>
            {% endif %}

            <form class="login-form" action="/forgot-password" method="post">
                <label>
                    <span>Username</span>
                    <input name="username" type="text" autocomplete="username" required>
                </label>
                <label>
                    <span>Email</span>
                    <input name="email" type="email" autocomplete="email" required>
                </label>
                <label>
                    <span>New password</span>
                    <input name="password" type="password" minlength="8" autocomplete="new-password" required>
                </label>
                <button type="submit">Reset Password</button>
            </form>

            <a class="auth-helper-link" href="/login">Back to login</a>
        </section>
    </main>
</div>
{% endblock %}
